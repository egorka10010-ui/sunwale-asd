<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anguardin Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{background:#000;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;line-height:1.3;min-height:100vh;display:flex;flex-direction:column;padding:12px 10px 80px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
    button,input,select,textarea{font-family:inherit;font-weight:700;}
    .shop{max-width:500px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
    .header{text-align:center;padding:2px 0 6px;border-bottom:1px solid #1f1f1f;}
    .logo{font-size:24px;font-weight:800;letter-spacing:-0.5px;text-transform:uppercase;}
    .logo span{color:#aaa;}
    .subhead{font-size:11px;font-weight:700;color:#8e8e8e;letter-spacing:0.3px;margin-top:2px;text-transform:uppercase;}
    .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
    .tab-btn{background:#111;border:1px solid #2a2a2a;color:#888;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;}
    .tab-btn.active{background:#fff;color:#000;border-color:#fff;}
    .toolbar{display:flex;gap:8px;margin-bottom:4px;}
    .search-input{flex:1;background:#111;border:1px solid #2a2a2a;border-radius:12px;padding:10px 12px;color:#fff;font-size:13px;font-weight:600;outline:none;}
    .filter-btn{background:#111;border:1px solid #2a2a2a;color:#fff;border-radius:12px;padding:0 14px;font-size:16px;cursor:pointer;}
    .account-list{display:flex;flex-direction:column;gap:8px;}
    .account-card{background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;transition:all 0.1s;box-shadow:0 2px 8px rgba(0,0,0,0.5);}
    .account-card:active{background:#151515;border-color:#444;}
    .account-info{display:flex;flex-direction:column;gap:4px;flex:1;overflow:hidden;}
    .country{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;white-space:nowrap;}
    .country .flag{font-size:18px;}
    .country .code{background:#1a1a1a;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700;color:#ccc;border:1px solid #333;}
    .details{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;font-weight:600;color:#999;margin-top:2px;}
    .price-block{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px;}
    .price{font-size:16px;font-weight:800;white-space:nowrap;line-height:1.1;}
    .price small{font-size:10px;font-weight:700;color:#777;margin-left:2px;}
    .buy-btn{background:#fff;border:none;color:#000;font-weight:800;font-size:12px;padding:8px 14px;border-radius:20px;cursor:pointer;text-transform:uppercase;}
    .buy-btn:active{background:#ccc;}
    .nav-bar{position:fixed;bottom:0;left:0;right:0;background:#000;padding:8px 10px 16px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;border-top:1px solid #1f1f1f;z-index:50;}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:none;color:#666;font-size:10px;font-weight:700;cursor:pointer;padding:6px 0;}
    .nav-item.active{color:#fff;}
    .nav-item .icon{font-size:18px;}
    .cart-badge{position:absolute;top:0;right:15px;background:#fff;color:#000;font-size:10px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:100;}
    .modal.open{display:flex;}
    .modal-content{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:20px 20px 0 0;width:100%;max-width:500px;padding:20px;display:flex;flex-direction:column;gap:16px;animation:slideUp 0.2s ease-out;max-height:85vh;overflow-y:auto;}
    @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .modal-title{font-size:18px;font-weight:800;}
    .close-btn{background:#1a1a1a;border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .profile-info{display:flex;flex-direction:column;gap:8px;}
    .profile-row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:8px 0;border-bottom:1px solid #1a1a1a;}
    .profile-row span:first-child{color:#888;}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:200;box-shadow:0 4px 12px rgba(255,255,255,0.1);white-space:nowrap;}
    .toast.show{opacity:1;}
    .filter-panel{display:none;gap:8px;flex-wrap:wrap;padding:10px 0;}
    .filter-panel.open{display:flex;}
    .filter-chip{background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;}
    .filter-chip.active{background:#fff;color:#000;}
    .support-link{color:#fff;font-weight:800;font-size:16px;text-decoration:none;display:inline-block;margin-top:6px;padding:4px 10px;background:#1a1a1a;border-radius:8px;border:1px solid #333;}
    .cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1f1f1f;}
    .cart-item-info{display:flex;flex-direction:column;gap:2px;}
    .cart-item-title{font-size:14px;font-weight:800;}
    .cart-item-price{font-size:12px;font-weight:700;color:#aaa;}
    .remove-btn{background:#2a1a1a;border:1px solid #4a2a2a;color:#ff6b6b;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;}
    .checkout-total{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:16px;font-weight:800;border-top:1px solid #333;margin-top:10px;}
    .crypto-pay-btn{background:#0088cc;color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:800;width:100%;cursor:pointer;text-transform:uppercase;margin-top:10px;}
    .crypto-pay-btn:active{background:#0077b3;}
    .crypto-pay-btn:disabled{opacity:0.5;}
    .empty-cart{text-align:center;color:#666;padding:30px 0;font-weight:600;}
  </style>
</head>
<body>
  <div class="shop">
    <header class="header">
      <div class="logo">ANGUARDIN<span>SHOP</span></div>
      <div class="subhead">Telegram аккаунты • без РФ</div>
    </header>

    <div class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="all">Все</button>
      <button class="tab-btn" data-tab="cheap">До 200₽</button>
      <button class="tab-btn" data-tab="aged">С отлежкой</button>
      <button class="tab-btn" data-tab="usa">США</button>
      <button class="tab-btn" data-tab="europe">Европа</button>
    </div>
    <div class="toolbar">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по стране или коду...">
      <button class="filter-btn" id="filterToggle">⚙️</button>
    </div>
    <div class="filter-panel" id="filterPanel">
      <button class="filter-chip active" data-filter="all">Все</button>
      <button class="filter-chip" data-filter="2fa">2FA</button>
      <button class="filter-chip" data-filter="email">Email</button>
      <button class="filter-chip" data-filter="aged">2022+</button>
    </div>
    <div class="account-list" id="accountList"></div>
  </div>

  <div class="nav-bar">
    <button class="nav-item active" data-view="shop"><span class="icon">🛍️</span>Магазин</button>
    <button class="nav-item" data-view="cart"><span class="icon">🛒</span>Корзина<span class="cart-badge" id="cartBadge" style="display:none;">0</span></button>
    <button class="nav-item" data-view="orders"><span class="icon">📦</span>Заказы</button>
    <button class="nav-item" data-view="support"><span class="icon">💬</span>Поддержка</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    (function(){
      const tg = window.Telegram?.WebApp;
      if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }

      // ==========================================
      // ВСТАВЬ СЮДА СВОЙ ТОКЕН ОТ CRYPTOBOT
      // ==========================================
      const CRYPTO_BOT_TOKEN = '653265:AAZMQwjfZr0GlWBRXAmUFH35nCpQKcMxxgs'; 
      // ==========================================

      const accounts = [
        {id:1, country:'США', flag:'🇺🇸', code:'+1', price:100, year:2023, features:['2FA','Email'], region:'usa', aged:false},
        {id:2, country:'США + год отлежки', flag:'🇺🇸', code:'+1', price:150, year:2022, features:['2FA','Email','Aged'], region:'usa', aged:true},
        {id:3, country:'Украина', flag:'🇺🇦', code:'+380', price:280, year:2023, features:['2FA','Email'], region:'europe', aged:false},
        {id:4, country:'Германия', flag:'🇩🇪', code:'+49', price:180, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:5, country:'Великобритания', flag:'🇬🇧', code:'+44', price:190, year:2023, features:['2FA','Email'], region:'europe', aged:false},
        {id:6, country:'Франция', flag:'🇫🇷', code:'+33', price:170, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:7, country:'Канада', flag:'🇨🇦', code:'+1', price:160, year:2023, features:['2FA','Email'], region:'usa', aged:false},
        {id:8, country:'Нидерланды', flag:'🇳🇱', code:'+31', price:150, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:9, country:'Испания', flag:'🇪🇸', code:'+34', price:140, year:2023, features:['2FA'], region:'europe', aged:false},
        {id:10, country:'Италия', flag:'🇮🇹', code:'+39', price:140, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:11, country:'Польша', flag:'🇵🇱', code:'+48', price:120, year:2023, features:['Email'], region:'europe', aged:false},
        {id:12, country:'Швеция', flag:'🇸🇪', code:'+46', price:160, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:13, country:'Норвегия', flag:'🇳🇴', code:'+47', price:170, year:2023, features:['2FA'], region:'europe', aged:false},
        {id:14, country:'Дания', flag:'🇩🇰', code:'+45', price:160, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:15, country:'Финляндия', flag:'🇫🇮', code:'+358', price:150, year:2023, features:['2FA','Email'], region:'europe', aged:false},
        {id:16, country:'Швейцария', flag:'🇨🇭', code:'+41', price:200, year:2022, features:['2FA','Email','Aged'], region:'europe', aged:true},
        {id:17, country:'Австрия', flag:'🇦🇹', code:'+43', price:180, year:2023, features:['2FA'], region:'europe', aged:false},
        {id:18, country:'Бельгия', flag:'🇧🇪', code:'+32', price:170, year:2022, features:['Email'], region:'europe', aged:true},
        {id:19, country:'Португалия', flag:'🇵🇹', code:'+351', price:150, year:2023, features:['2FA','Email'], region:'europe', aged:false},
        {id:20, country:'Чехия', flag:'🇨🇿', code:'+420', price:130, year:2022, features:['2FA'], region:'europe', aged:true},
        {id:21, country:'Греция', flag:'🇬🇷', code:'+30', price:140, year:2023, features:['Email'], region:'europe', aged:false},
        {id:22, country:'Ирландия', flag:'🇮🇪', code:'+353', price:160, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:23, country:'Турция', flag:'🇹🇷', code:'+90', price:120, year:2023, features:['2FA','Email'], region:'europe', aged:false},
        {id:24, country:'Израиль', flag:'🇮🇱', code:'+972', price:180, year:2022, features:['2FA','Email'], region:'europe', aged:true},
        {id:25, country:'Япония', flag:'🇯🇵', code:'+81', price:190, year:2023, features:['2FA','Email'], region:'asia', aged:false},
        {id:26, country:'Южная Корея', flag:'🇰🇷', code:'+82', price:180, year:2022, features:['2FA'], region:'asia', aged:true},
        {id:27, country:'Австралия', flag:'🇦🇺', code:'+61', price:200, year:2023, features:['2FA','Email'], region:'asia', aged:false}
      ];

      let currentTab = 'all';
      let currentFilter = 'all';
      let searchQuery = '';
      let cart = [];
      let orders = [];

      const accountList = document.getElementById('accountList');
      const searchInput = document.getElementById('searchInput');
      const filterToggle = document.getElementById('filterToggle');
      const filterPanel = document.getElementById('filterPanel');
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modalContent');
      const toastEl = document.getElementById('toast');
      const cartBadge = document.getElementById('cartBadge');

      function showToast(msg){
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(()=>toastEl.classList.remove('show'), 2500);
      }

      function updateCartBadge(){
        if(cart.length > 0){ cartBadge.style.display = 'flex'; cartBadge.textContent = cart.length; }
        else { cartBadge.style.display = 'none'; }
      }

      function renderAccounts(){
        let filtered = accounts.filter(a => {
          if(searchQuery && !a.country.toLowerCase().includes(searchQuery) && !a.code.includes(searchQuery)) return false;
          if(currentFilter === '2fa' && !a.features.includes('2FA')) return false;
          if(currentFilter === 'email' && !a.features.includes('Email')) return false;
          if(currentFilter === 'aged' && !a.aged) return false;
          if(currentTab === 'cheap' && a.price > 200) return false;
          if(currentTab === 'aged' && !a.aged) return false;
          if(currentTab === 'usa' && a.region !== 'usa') return false;
          if(currentTab === 'europe' && a.region !== 'europe') return false;
          return true;
        });

        accountList.innerHTML = filtered.map(a => `
          <div class="account-card" data-id="${a.id}">
            <div class="account-info">
              <div class="country">
                <span class="flag">${a.flag}</span> ${a.country}
                <span class="code">${a.code}</span>
              </div>
              <div class="details">
                <span>📅 ${a.year}</span>
                ${a.features.map(f => `<span>• ${f}</span>`).join('')}
              </div>
            </div>
            <div class="price-block">
              <div class="price">${a.price} <small>₽</small></div>
              <button class="buy-btn" data-id="${a.id}">Купить</button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('.buy-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            const acc = accounts.find(a => a.id === id);
            if(!acc) return;
            
            if(cart.find(c => c.id === id)){
              showToast('Уже в корзине');
              return;
            }
            
            cart.push(acc);
            updateCartBadge();
            showToast(`✅ ${acc.country} добавлен в корзину`);
            
            if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            btn.textContent = '✓';
            btn.style.background = '#2a2a2a';
            btn.style.color = '#fff';
            btn.disabled = true;
            setTimeout(()=>{
              btn.textContent = 'Купить';
              btn.style.background = '#fff';
              btn.style.color = '#000';
              btn.disabled = false;
            }, 1500);
          });
        });
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          renderAccounts();
        });
      });
      searchInput.addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderAccounts(); });
      filterToggle.addEventListener('click', () => filterPanel.classList.toggle('open'));
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentFilter = chip.dataset.filter;
          renderAccounts();
        });
      });

      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          const view = item.dataset.view;
          if(view === 'shop'){ modal.classList.remove('open'); renderAccounts(); }
          else if(view === 'cart'){ openCartModal(); }
          else if(view === 'orders'){ openOrdersModal(); }
          else if(view === 'support'){ openSupportModal(); }
        });
      });

      function openCartModal(){
        modalContent.innerHTML = `
          <div class="modal-header">
            <div class="modal-title">Корзина</div>
            <button class="close-btn" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
          </div>
          ${cart.length === 0 ? '<div class="empty-cart">Корзина пуста</div>' : `
            <div class="profile-info">
              ${cart.map(item => `
                <div class="cart-item">
                  <div class="cart-item-info">
                    <div class="cart-item-title">${item.flag} ${item.country}</div>
                    <div class="cart-item-price">${item.price} ₽</div>
                  </div>
                  <button class="remove-btn" onclick="removeFromCart(${item.id})">Удалить</button>
                </div>
              `).join('')}
            </div>
            <div class="checkout-total">
              <span>Итого:</span>
              <span>${cart.reduce((sum, i) => sum + i.price, 0)} ₽</span>
            </div>
            <button class="crypto-pay-btn" id="checkoutBtn" style="background:#fff; color:#000;">Оплатить через CryptoBot</button>
          `}
        `;
        modal.classList.add('open');
        if(cart.length > 0) document.getElementById('checkoutBtn').addEventListener('click', processPayment);
      }

      window.removeFromCart = function(id){
        cart = cart.filter(item => item.id !== id);
        updateCartBadge();
        openCartModal();
      };

      async function processPayment(){
        if(CRYPTO_BOT_TOKEN === 'ТВОЙ_ТОКЕН_ЗДЕСЬ') {
          showToast('❌ Вставь токен в код!');
          return;
        }

        const checkoutBtn = document.getElementById('checkoutBtn');
        checkoutBtn.textContent = 'Создание счета...';
        checkoutBtn.disabled = true;

        const totalRub = cart.reduce((sum, i) => sum + i.price, 0);
        // Перевод в USDT (курс условный, поменяй под свой)
        const totalUsdt = (totalRub / 90).toFixed(2); 

        try {
          // ПРЯМОЙ ЗАПРОС К API CRYPTOBOT
          const response = await fetch('https://pay.crypt.bot/api/createInvoice', {
            method: 'POST',
            headers: {
              'Crypto-Pay-API-Token': CRYPTO_BOT_TOKEN,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              asset: 'USDT',
              amount: totalUsdt,
              description: `Покупка в Anguardin Shop (${cart.length} шт.)`,
              payload: JSON.stringify({ userId: tg?.initDataUnsafe?.user?.id || 'guest' }),
              allow_comments: false,
              allow_anonymous: true
            })
          });

          const data = await response.json();

          if(data.ok && data.result) {
            const payUrl = data.result.bot_invoice_url;
            
            // Открываем нативное окно оплаты внутри Telegram
            if(tg && tg.openInvoice) {
              tg.openInvoice(payUrl, (status) => {
                if(status === 'paid') {
                  showToast('✅ Оплата прошла успешно!');
                  orders.push(...cart);
                  cart = [];
                  updateCartBadge();
                  modal.classList.remove('open');
                  renderAccounts();
                } else if (status === 'cancelled') {
                  showToast('❌ Оплата отменена');
                  checkoutBtn.textContent = 'Оплатить через CryptoBot';
                  checkoutBtn.disabled = false;
                }
              });
            } else {
              // Фоллбэк для браузера
              window.open(payUrl, '_blank');
              showToast('Открыто окно CryptoBot');
              orders.push(...cart);
              cart = [];
              updateCartBadge();
              modal.classList.remove('open');
              renderAccounts();
            }
          } else {
            throw new Error(data.error?.message || 'Ошибка API');
          }
        } catch (error) {
          console.error(error);
          showToast('❌ Ошибка: ' + error.message);
          checkoutBtn.textContent = 'Оплатить через CryptoBot';
          checkoutBtn.disabled = false;
        }
      }

      function openOrdersModal(){
        modalContent.innerHTML = `
          <div class="modal-header">
            <div class="modal-title">Мои заказы</div>
            <button class="close-btn" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
          </div>
          <div class="profile-info">
            ${orders.length === 0 ? '<div style="text-align:center;color:#666;padding:20px;">Нет заказов</div>' : 
              orders.map(o => `
                <div class="profile-row">
                  <span>${o.flag} ${o.country} (${o.code})</span>
                  <span>${o.price} ₽</span>
                </div>
              `).join('')
            }
          </div>
          <button class="buy-btn" style="width:100%;margin-top:10px;" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>
        `;
        modal.classList.add('open');
      }

      function openSupportModal(){
        modalContent.innerHTML = `
          <div class="modal-header">
            <div class="modal-title">Поддержка</div>
            <button class="close-btn" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
          </div>
          <div style="font-size:13px;color:#aaa;text-align:center;padding:20px 0;">
            Напишите нам в Telegram:<br>
            <a href="https://t.me/efuea" target="_blank" class="support-link">@efuea</a>
          </div>
          <button class="buy-btn" style="width:100%;margin-top:10px;" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>
        `;
        modal.classList.add('open');
      }

      modal.addEventListener('click', (e) => {
        if(e.target === modal) modal.classList.remove('open');
      });

      renderAccounts();
    })();
  </script>
</body>
